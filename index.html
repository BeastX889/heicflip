<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heicflip – HEIC to JPG Converter</title>
<meta name="description" content="Convert iPhone HEIC photos to JPG, PNG or WebP in bulk. Keeps the date taken, removes location, works offline. Photos never leave your PC.">
<meta name="theme-color" content="#f6f4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18171a" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
